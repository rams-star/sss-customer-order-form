<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kitchen Order Form</title>
    <link rel="icon" type="image/jpeg" href="SSS.jpg">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f6f9; margin: 0; padding: 16px; display: flex; justify-content: center; padding-bottom: 90px; }
        .card { background: #ffffff; padding: 24px; border-radius: 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.08); width: 100%; max-width: 520px; }
        .header-logo { text-align: center; margin-bottom: 12px; }
        .header-logo img { max-width: 90px; height: auto; display: inline-block; }
        h2 { margin: 0 0 16px 0; color: #1b4332; text-align: center; font-size: 22px; }
        label { display: block; margin-bottom: 6px; font-weight: 600; color: #333; font-size: 14px; }
        input[type="text"], input[type="tel"], input[type="search"] { width: 100%; padding: 11px; margin-bottom: 14px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box; font-size: 15px; background: #fff; }

        .order-type-box { margin-bottom: 16px; }
        .radio-group { display: flex; gap: 12px; margin-top: 6px; }
        .radio-option { flex: 1; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 12px; border: 1px solid #ccc; border-radius: 8px; cursor: pointer; font-weight: 600; color: #333; background: #f8faf9; }
        .radio-option input[type="radio"] { margin: 0; accent-color: #2d6a4f; width: 16px; height: 16px; }
        .locked-type-badge { display: inline-block; background: #e9f5ee; color: #1b4332; border: 1px solid #b7e4c7; padding: 8px 12px; border-radius: 8px; font-weight: 600; font-size: 14px; margin-bottom: 14px; }
        
        .category-title { color: #1b4332; font-size: 17px; font-weight: bold; margin: 20px 0 10px 0; border-bottom: 2px solid #e9f5ee; padding-bottom: 4px; }
        .menu-item-card { background: #f8faf9; border: 1px solid #d8e2dc; padding: 12px 14px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; }
        .menu-item-info { flex: 1; padding-right: 10px; }
        .menu-item-name { font-weight: 600; color: #2d6a4f; font-size: 15px; margin-bottom: 2px; }
        .menu-item-price { color: #555; font-size: 14px; font-weight: 500; }
        
        .stepper { display: flex; align-items: center; background: #fff; border: 1px solid #ccc; border-radius: 8px; overflow: hidden; }
        .stepper button { background: #2d6a4f; color: white; border: none; width: 34px; height: 34px; font-size: 18px; font-weight: bold; cursor: pointer; }
        .stepper button:active { background: #1b4332; }
        .stepper input { width: 40px; text-align: center; border: none; font-size: 15px; font-weight: 600; margin: 0; padding: 0; background: transparent; }
        .stepper input::-webkit-outer-spin-button, .stepper input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }

        .sticky-footer { position: fixed; bottom: 0; left: 0; right: 0; background: #ffffff; box-shadow: 0 -4px 16px rgba(0,0,0,0.1); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 1000; border-top: 1px solid #ddd; }
        .sticky-footer .total-text { font-size: 16px; color: #333; font-weight: bold; }
        .sticky-footer .total-amount { font-size: 20px; color: #1b4332; font-weight: bold; }
        .submit-btn { background: #2d6a4f; color: white; border: none; padding: 12px 24px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; }
        .submit-btn:hover { background: #1b4332; }
        
        .status-msg { text-align: center; padding: 30px 10px; color: #444; font-size: 16px; line-height: 1.5; }
        .success-box { background: #d8f3dc; color: #1b4332; padding: 20px; border-radius: 10px; text-align: center; }
        .receipt-card { background: #ffffff; color: #333; text-align: left; padding: 16px; border-radius: 8px; margin: 16px 0; border: 1px solid #b7e4c7; font-size: 14px; line-height: 1.6; }
        .receipt-card h4 { margin: 0 0 8px 0; color: #1b4332; border-bottom: 1px solid #eee; padding-bottom: 6px; font-size: 16px; }
        .receipt-total { font-weight: bold; font-size: 16px; color: #1b4332; border-top: 1px solid #eee; margin-top: 8px; padding-top: 8px; display: flex; justify-content: space-between; }
        .whatsapp-btn { background: #25d366; color: white; text-decoration: none; display: block; padding: 13px; border-radius: 8px; font-weight: bold; margin-top: 12px; font-size: 15px; }

        /* Animated Loading Overlay Styles */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
        }
        .spinner {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #2d6a4f;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
        }
        .loading-text {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <!-- Animated Loading Overlay -->
    <div id="loadingOverlay" class="loading-overlay" style="display:none;">
        <div class="spinner"></div>
        <div class="loading-text">Placing your order, please wait...</div>
    </div>

    <div class="card">
        <div class="header-logo">
            <img src="SSS.jpg" alt="SSS Logo">
        </div>
        <h2>Kitchen Order Form</h2>

        <div id="loader" class="status-msg">Loading menu...</div>
        <div id="closedMsg" class="status-msg" style="display:none;"></div>
        
        <form id="orderForm" style="display:none;" onsubmit="submitOrder(event)">
            <label for="customerName">Name *</label>
            <input type="text" id="customerName" required placeholder="Enter your name">

            <label for="customerMobile">Mobile Number *</label>
            <input type="tel" id="customerMobile" required placeholder="Enter your mobile number">

            <!-- Dynamic Order Type Section (populated from Events!Allowed Order Type) -->
            <div id="orderTypeContainer" class="order-type-box"></div>

            <label>Browse & Select Items *</label>
            <input type="search" id="menuSearch" placeholder="🔍 Search menu items (e.g. Dosa, Idly)..." oninput="filterMenu()">

            <div id="menuContainer"></div>

            <div style="height: 30px;"></div>

            <!-- Sticky Bottom Checkout Bar -->
            <div class="sticky-footer">
                <div>
                    <div class="total-text">Total: <span id="stickyTotal" class="total-amount">$0.00</span></div>
                </div>
                <button type="submit" class="submit-btn" id="submitBtn">Submit Order</button>
            </div>
        </form>

        <div id="successScreen" class="success-box" style="display:none;">
            <h3 style="margin-top:0;">Order Received!</h3>
            <p style="margin-bottom:8px;">Your order has been sent to our kitchen successfully.</p>
            
            <div id="receiptDetails" class="receipt-card"></div>

            <!-- WHATSAPP FEATURE (Commented Out as Requested) -->
            <!--
            <p style="font-size: 13px; color: #2d6a4f; margin-bottom: 6px;">Optional: Send a copy directly to our WhatsApp</p>
            <a id="whatsappLink" href="#" target="_blank" class="whatsapp-btn">Send Order Details via WhatsApp</a>
            -->

            <button type="button" class="submit-btn" style="margin-top:12px; background:#046A38; width:100%;" onclick="location.reload()">Place Another Order</button>
            <p style="font-size: 13px; color: #000000; margin-bottom: 6px; margin-top:10px;">Thank you for your support!</p>
        </div>
    </div>

    <script>
        const scriptURL = 'https://script.google.com/macros/s/AKfycbziuk9f9wSi7o9mmLPAy9oVSG1VkOt6NKlmvRm81b9uVJzbYdDvDUKmLoDLzTEjJwo/exec';
        let menuData = [];
        let activeOrderType = 'Take Away';

        const urlParams = new URLSearchParams(window.location.search);
        const eventParam = (urlParams.get('event') || '').trim();
        const cacheKey = eventParam ? `sss_menu_cache_${eventParam.toLowerCase()}` : 'sss_menu_cache';

        function configureOrderType(allowedRaw) {
            const container = document.getElementById('orderTypeContainer');
            const parsedTypes = String(allowedRaw || 'Take Away')
                .split(',')
                .map(t => t.trim())
                .filter(Boolean);

            const validTypes = parsedTypes.filter(t => t === 'Eat In' || t === 'Take Away');
            const options = validTypes.length > 0 ? validTypes : ['Take Away'];

            if (options.length === 1) {
                activeOrderType = options[0];
                container.innerHTML = `
                    <label>Order Type</label>
                    <div class="locked-type-badge">${activeOrderType} Only</div>
                `;
            } else {
                activeOrderType = '';
                container.innerHTML = `
                    <label>Order Type *</label>
                    <div class="radio-group">
                        ${options.map(opt => `
                            <label class="radio-option">
                                <input type="radio" name="orderType" value="${opt}" required onchange="activeOrderType = this.value">
                                <span>${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                `;
            }
        }

        function getSelectedOrderType() {
            const checked = document.querySelector('input[name="orderType"]:checked');
            if (checked) {
                activeOrderType = checked.value;
            }
            return activeOrderType;
        }

        function processServerData(data) {
            document.getElementById('loader').style.display = 'none';

            if (data.status === 'closed') {
                const closedDiv = document.getElementById('closedMsg');
                let formattedMsg = (data.message || "Online pre-orders are closed for now.")
                    .replace('Arthi Shivaram', '<strong>Arthi Shivaram</strong>')
                    .replace('0433 949 007', '<strong>0433 949 007</strong>');

                closedDiv.innerHTML = formattedMsg;
                closedDiv.style.display = 'block';
                document.getElementById('orderForm').style.display = 'none';
                return;
            }

            menuData = data.menu || [];
            configureOrderType(data.allowedOrderType || data.allowedOrderTypes);
            document.getElementById('closedMsg').style.display = 'none';
            document.getElementById('orderForm').style.display = 'block';
            
            renderMenu();
        }

        window.addEventListener('DOMContentLoaded', () => {
            const cachedData = localStorage.getItem(cacheKey);
            let hasLoaded = false;

            if (cachedData) {
                try {
                    const parsed = JSON.parse(cachedData);
                    if (parsed && parsed.status === 'open' && Array.isArray(parsed.menu) && parsed.menu.length > 0) {
                        hasLoaded = true;
                        processServerData(parsed);
                    }
                } catch (e) {
                    localStorage.removeItem(cacheKey);
                }
            }

            const getUrl = eventParam
                ? `${scriptURL}?event=${encodeURIComponent(eventParam)}`
                : scriptURL;

            fetch(getUrl)
                .then(res => res.json())
                .then(data => {
                    hasLoaded = true;
                    if (data && data.status === 'open') {
                        localStorage.setItem(cacheKey, JSON.stringify(data));
                    }
                    processServerData(data);
                })
                .catch(err => {
                    console.error("Fetch error: ", err);
                    if (!hasLoaded) {
                        document.getElementById('loader').style.display = 'none';
                        const closedDiv = document.getElementById('closedMsg');
                        closedDiv.innerHTML = '⚠️ Unable to connect to the menu server. Please check your internet connection or Google Apps Script deployment.';
                        closedDiv.style.display = 'block';
                    }
                });
        });

        function renderMenu(filterText = '') {
            const container = document.getElementById('menuContainer');
            container.innerHTML = '';
            
            let categories = [...new Set(menuData.map(item => item.category))];
            let hasVisibleItems = false;

            categories.forEach(cat => {
                const catItems = menuData.filter(m => m.category === cat && m.name.toLowerCase().includes(filterText.toLowerCase()));
                if (catItems.length > 0) {
                    hasVisibleItems = true;
                    const catTitle = document.createElement('div');
                    catTitle.className = 'category-title';
                    catTitle.textContent = cat;
                    container.appendChild(catTitle);

                    catItems.forEach(item => {
                        const card = document.createElement('div');
                        card.className = 'menu-item-card';
                        card.innerHTML = `
                            <div class="menu-item-info">
                                <div class="menu-item-name">${item.name}</div>
                                <div class="menu-item-price">$${Number(item.price).toFixed(2)}</div>
                            </div>
                            <div class="stepper">
                                <button type="button" onclick="updateQty('${item.id}', -1)">-</button>
                                <input type="number" id="qty_${item.id}" value="${item.qty || 0}" min="0" onchange="validateQty('${item.id}')">
                                <button type="button" onclick="updateQty('${item.id}', 1)">+</button>
                            </div>
                        `;
                        container.appendChild(card);
                    });
                }
            });

            if (!hasVisibleItems) {
                container.innerHTML = `<div style="text-align:center; color:#777; padding:20px;">No menu items found matching "${filterText}".</div>`;
            }
        }

        function filterMenu() {
            const query = document.getElementById('menuSearch').value;
            renderMenu(query);
        }

        function updateQty(id, change) {
            const item = menuData.find(m => m.id === id);
            if (item) {
                item.qty = Math.max(0, (item.qty || 0) + change);
                document.getElementById(`qty_${id}`).value = item.qty;
                calculateGrandTotal();
            }
        }

        function validateQty(id) {
            const input = document.getElementById(`qty_${id}`);
            const item = menuData.find(m => m.id === id);
            if (item) {
                item.qty = Math.max(0, parseInt(input.value) || 0);
                input.value = item.qty;
                calculateGrandTotal();
            }
        }

        function calculateGrandTotal() {
            let total = 0;
            menuData.forEach(item => {
                if (item.qty && item.qty > 0) {
                    total += item.qty * Number(item.price);
                }
            });
            document.getElementById('stickyTotal').textContent = `$${total.toFixed(2)}`;
        }

        function submitOrder(e) {
            e.preventDefault();
            const custName = document.getElementById('customerName').value.trim();
            const custMobile = document.getElementById('customerMobile').value.trim();
            const orderType = getSelectedOrderType();

            if (!orderType) {
                alert('Please select Eat In or Take Away before submitting.');
                return;
            }
            
            const items = [];
            let receiptItemsHtml = "";
            let summaryText = "New Order Received!\n\nCustomer: " + custName + "\nMobile: " + custMobile + "\nOrder Type: " + orderType + "\n\nItems:\n";

            menuData.forEach(item => {
                if (item.qty && item.qty > 0) {
                    const subTotal = (item.qty * Number(item.price)).toFixed(2);
                    items.push({ itemId: item.id, price: Number(item.price), quantity: item.qty });
                    summaryText += `- ${item.name} (Qty: ${item.qty})\n`;
                    receiptItemsHtml += `<div style="display:flex; justify-content:space-between; margin-bottom:4px;">
                        <span>${item.name} &times; ${item.qty}</span>
                        <span>$${subTotal}</span>
                    </div>`;
                }
            });

            if (items.length === 0) {
                alert('Please select at least one menu item before submitting.');
                return;
            }

            const totalAmount = document.getElementById('stickyTotal').textContent;
            summaryText += `\nTotal: ${totalAmount}\nPayment via PayID: 0433949007 (Arthi Shivaram)`;

            const payload = {
                customerName: custName,
                customerMobile: custMobile,
                orderType: orderType,
                event: eventParam || '',
                items: items
            };

            // Show the animated loading overlay immediately
            document.getElementById('loadingOverlay').style.display = 'flex';

            fetch(scriptURL, {
                method: 'POST',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
            })
            .then(res => res.json())
            .then(data => {
                // Hide the loading overlay once response arrives
                document.getElementById('loadingOverlay').style.display = 'none';

                if (data.result === 'success') {
                    const now = new Date();
                    const sydneyDateTime = now.toLocaleString('en-AU', {
                        timeZone: 'Australia/Sydney',
                        day: '2-digit',
                        month: '2-digit',
                        year: 'numeric',
                        hour: 'numeric',
                        minute: '2-digit',
                        hour12: true
                    });

                    const orderIdDisplay = data.orderId ? data.orderId : 'N/A';

                    document.getElementById('receiptDetails').innerHTML = `
                        <h4>Order Summary</h4>
                        <div style="margin-bottom:8px;">
                            <strong>Order ID:</strong> ${orderIdDisplay}<br>
                            <strong>Order Date:</strong> ${sydneyDateTime} (Sydney)<br>
                            <strong>Name:</strong> ${custName}<br>
                            <strong>Mobile:</strong> ${custMobile}<br>
                            <strong>Order Type:</strong> ${orderType}
                        </div>
                        <div style="border-top:1px solid #eee; padding-top:8px;">
                            ${receiptItemsHtml}
                        </div>
                        <div class="receipt-total">
                            <span>Total Paid / Due:</span>
                            <span>${totalAmount}</span>
                        </div>
                        <div style="margin-top:12px; padding:10px; background:#fdfcdc; border:1px solid #f1dca7; border-radius:6px; text-align:center;">
                            <div style="font-size: 1.1rem; font-weight: bold; color: #000;">PayID: 0433949007</div>
                            <div style="font-size: 0.95rem; color: #333; font-weight: 600;">Arthi Shivaram</div>
                        </div>
                    `;

                    document.getElementById('orderForm').style.display = 'none';

                    // WHATSAPP JS LOGIC (Currently Commented Out)
                    /*
                    const whatsappUrl = `https://wa.me/61433949007?text=` + encodeURIComponent(summaryText);
                    document.getElementById('whatsappLink').setAttribute('href', whatsappUrl);
                    */

                    document.getElementById('successScreen').style.display = 'block';
                } else {
                    throw new Error(data.error || 'Unknown error');
                }
            })
            .catch(err => {
                // Hide the loading overlay if an error occurs
                document.getElementById('loadingOverlay').style.display = 'none';
                alert('Error submitting order: ' + err.message);
            });
        }
    </script>
</body>
</html>
